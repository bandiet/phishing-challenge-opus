<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phishing Challenge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app" data-screen="laden">

  <div class="bg" aria-hidden="true">
    <svg class="bg-flaechen" viewBox="0 0 1650 928" preserveAspectRatio="xMidYMid slice">
      <polygon class="f1" points="0,157 1080,66 1230,416 345,928 0,928"/>
      <polygon class="f2" points="250,0 1650,375 1650,928 235,928 0,230 0,0"/>
      <polygon class="f3" points="1095,55 1430,33 1430,928 1040,928"/>
    </svg>
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-funken"></div>
  </div>

  <header class="hud" id="hud">
    <div class="hud-pille hud-marke">
      <img class="hud-logo" src="assets/hacker-face.png" alt="">
      <span id="hud-titel"></span>
    </div>
    <div class="hud-rechts">
      <div class="chip-box joker-box zu">
        <button class="joker" id="joker" type="button">
          <span class="joker-figur"></span>
          <b class="joker-zahl" id="joker-zahl">0</b>
        </button>
      </div>
      <div class="chip-box serie-box zu">
        <button class="serie" id="serie" type="button">
          <svg class="flamme" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF4D1F"/><stop offset=".6" stop-color="#FF9A1F"/><stop offset="1" stop-color="#FFD84D"/></linearGradient></defs>
            <path d="M12 2.5c.7 3.2 3.4 4.9 4.6 7.6 1.6 3.6-.4 9.4-4.6 9.4S5.6 16.2 6.6 12.6c.5-1.9 1.9-3 2.4-4.6.5 1.4.9 2.4 2 3 .2-2.9 0-5.7 1-8.5Z" fill="url(#fl)"/>
            <path d="M12 19.5c-1.9 0-3-1.5-2.6-3.3.3-1.2 1.3-1.9 1.6-3 .8 1 2 1.6 2.6 2.9.7 1.6-.2 3.4-1.6 3.4Z" fill="#FFF3B0"/></svg>
          <span class="serie-text"><b id="serie-zahl">0</b><small id="serie-label"></small></span>
        </button>
      </div>
      <div class="hud-pille hud-fortschritt" id="hud-fortschritt" hidden>
        <span class="hud-level" id="hud-level"></span>
        <span class="hud-frage"><span id="hud-frage"></span><span class="hud-segmente" id="hud-segmente"></span></span>
      </div>
      <button class="icon-btn" id="ton" type="button">
        <svg class="ico ton-an" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ico ton-aus" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9.5 5 5m0-5-5 5"/></svg>
      </button>
    </div>
  </header>

  <main class="buehne" id="buehne"></main>

  <!-- Hacker wie in der ursprünglichen Challenge (SVG), mit mehr Mimik -->
  <div class="hacker" id="hacker" aria-hidden="true">
    <div class="hacker-figur">
      <svg class="hacker-svg" viewBox="0 0 280 540" fill="none">
        <defs>
          <filter id="hkSchatten" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
          <linearGradient id="hkSchweiss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
          <linearGradient id="hkKapuze" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#381c5a"/><stop offset=".35" stop-color="#251343"/><stop offset="1" stop-color="#120824"/></linearGradient>
          <linearGradient id="hkRumpf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#28174a"/><stop offset="1" stop-color="#150b28"/></linearGradient>
          <linearGradient id="hkStreifen1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d115e"/><stop offset=".5" stop-color="#b51a77"/><stop offset="1" stop-color="#8d115e"/></linearGradient>
          <linearGradient id="hkStreifen2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff0066"/><stop offset=".5" stop-color="#ff0d75"/><stop offset="1" stop-color="#ff0066"/></linearGradient>
          <linearGradient id="hkHand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ba9379"/><stop offset="1" stop-color="#9a7158"/></linearGradient>
        </defs>
        <ellipse cx="140" cy="518" rx="68" ry="16" fill="#322258" opacity=".55" filter="url(#hkSchatten)"/>
        <g class="hk-rumpf">
          <path d="M82 410c0 72 116 72 116 0Z" fill="#07040d"/>
          <path d="M76 330c-2 50 2 110 64 110s66-60 64-110Z" fill="url(#hkRumpf)"/>
          <path d="M75 352l65 40 65-40-1 20-64 40-64-40Z" fill="url(#hkStreifen1)"/>
          <path d="M76 388l34 16v36h12v-31l18 10 18-10v31h12v-36l34-16v9l-28 14v29h-12v-24l-24 13-24-13v24h-12v-29l-28-14Z" fill="url(#hkStreifen2)"/>
        </g>
        <rect class="hk-hand-l" x="28" y="335" width="34" height="54" rx="17" fill="url(#hkHand)" transform="rotate(-40 45 362)"/>
        <rect class="hk-hand-r" x="218" y="335" width="34" height="54" rx="17" fill="url(#hkHand)" transform="rotate(40 235 362)"/>
        <g class="hk-kopf">
          <path d="M140 10C95 38 12 135 12 215s66 135 128 135 128-55 128-135S185 38 140 10Z" fill="url(#hkKapuze)"/>
          <path d="M140 55C90 85 26 160 26 225s54 115 114 115 114-50 114-115S190 85 140 55Z" fill="#0d061c"/>
          <path d="M40 160c-10 25-6 55 6 60-2-15 0-35 6-50Z" fill="#4f2d18"/>
          <path d="M240 160c10 25 6 55-6 60 2-15 0-35-6-50Z" fill="#4f2d18"/>
          <path d="M48 165c-22 0-24 37-2 37Z" fill="#a88267"/><path d="M44 172c-12 0-13 23-1 23Z" fill="#865f47"/>
          <path d="M232 165c22 0 24 37 2 37Z" fill="#a88267"/><path d="M236 172c12 0 13 23 1 23Z" fill="#865f47"/>
          <path d="M58 172c-4 46 12 106 82 148 70-42 86-102 82-148 0 0-47-32-82-32s-82 32-82 32Z" fill="#fff"/>
          <path d="M58 172c47-32 117-32 164 0 2-10-37-34-82-34s-84 24-82 34Z" fill="#cbd2db"/>
          <path class="hk-braue-l" d="M94 175c11-6 26-3 30 1" stroke="#232d3a" stroke-width="5" stroke-linecap="round"/>
          <path class="hk-braue-r" d="M186 175c-11-6-26-3-30 1" stroke="#232d3a" stroke-width="5" stroke-linecap="round"/>
          <ellipse class="hk-auge hk-auge-l" cx="107" cy="198" rx="5.5" ry="11" fill="#232d3a"/>
          <path class="hk-zwinker" d="M96 198q11-11 22 0" stroke="#232d3a" stroke-width="4.5" stroke-linecap="round"/>
          <ellipse class="hk-auge hk-auge-r" cx="173" cy="198" rx="5.5" ry="11" fill="#232d3a"/>
          <path class="hk-mund" d="M140 240c-12-6-26-7-33-3 7 9 21 12 33 12s26-3 33-12c-7-4-21-3-33 3Z" fill="#232d3a"/>
          <rect class="hk-bart" x="137" y="254" width="6.5" height="19" rx="3.25" fill="#232d3a"/>
          <g class="hk-funkel"><path d="M80 170q0 10-10 10 10 0 10 10 0-10 10-10-10 0-10-10Z" fill="#ff007f"/><circle cx="80" cy="180" r="2.5" fill="#fff"/></g>
          <g class="hk-schweiss"><path d="M212 144s14 20 14 29-7 15-16 15-16-6-16-15 18-29 18-29Z" fill="url(#hkSchweiss)"/><ellipse cx="206" cy="173" rx="2.5" ry="4" fill="#fff" opacity=".8"/></g>
          <circle class="hk-schweiss2" cx="225" cy="195" r="3.5" fill="#38bdf8" opacity=".9"/>
        </g>
      </svg>
      <div class="hacker-blase"><span id="hacker-blase"></span></div>
    </div>
  </div>

  <div class="hud-sprecher" id="hud-sprecher" role="status"></div>
  <canvas class="feier" id="feier" aria-hidden="true"></canvas>
  <div class="tooltip" id="tooltip" role="status"></div>
  <div class="sr" id="sr" aria-live="assertive"></div>
</div>

<script src="js/inhalt.de.js"></script>
<script src="js/domains.js"></script>
<script src="js/klang-daten.js"></script>
<script src="js/klang.js"></script>
<script src="js/feier.js"></script>
<script src="js/lms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
